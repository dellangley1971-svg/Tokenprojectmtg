<!DOCTYPE html>
<html lang="en" style="background-color: #0f1115 !important; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Token Browser</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTG Tokens">
  <link rel="apple-touch-icon" href="https://cards.scryfall.io/a/img/images/card_back.png">


  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #bb86fc;
      --text-color: #e1e1e6;
      --text-muted: #a0a0b0;
      --border-color: #2e323d;
      --badge-bg: rgba(0, 0, 0, 0.85);
    }


    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }


    html {
      background-color: #0f1115 !important;
      color-scheme: dark;
    }


    body {
      background-color: #0f1115 !important;
      color: var(--text-color) !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }


    header {
      background-color: var(--card-bg) !important;
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }


    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }


    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }


    .search-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
      justify-content: flex-end;
    }


    input[type="text"] {
      background-color: #0f1115 !important;
      border: 1px solid var(--border-color);
      color: #fff !important;
      padding: 0.5rem;
      border-radius: 6px;
      outline: none;
      width: 100%;
      max-width: 160px;
      font-size: 0.85rem;
    }


    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }


    .slot-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: #0f1115 !important;
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }


    .slot-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }


    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .slot-header label {
      font-size: 0.65rem;
      color: var(--accent-color);
      font-weight: bold;
      text-transform: uppercase;
    }


    .lock-btn {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      padding: 0 0.2rem;
      cursor: pointer;
      opacity: 0.6;
    }


    .lock-btn.locked {
      opacity: 1;
    }


    .slot-group select {
      width: 100%;
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-color);
      color: #fff !important;
      padding: 0.4rem;
      border-radius: 6px;
      font-size: 0.75rem;
      outline: none;
      text-overflow: ellipsis;
    }


    main {
      padding: 0.75rem;
      background-color: #0f1115 !important;
      flex: 1;
    }


    .board-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      max-width: 1200px;
      margin: 0 auto;
      gap: 0.75rem;
    }


    @media (min-width: 600px) {
      .board-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }


    .token-card {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .image-container {
      position: relative;
      width: 100%;
    }


    .token-card img {
      width: 100%;
      border-radius: 6px;
      aspect-ratio: 5/7;
      object-fit: cover;
      background-color: #000;
      display: block;
    }


    .token-qty-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--badge-bg);
      color: #fff;
      border: 1.5px solid var(--accent-color);
      border-radius: 12px;
      padding: 1px 5px;
      font-size: 0.7rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 2;
    }


    .pt-counter-badge {
      position: absolute;
      bottom: 40px;
      right: 6px;
      background: var(--badge-bg);
      color: #00e676;
      border: 1.5px solid #00e676;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.7rem;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      z-index: 2;
    }


    .token-info {
      width: 100%;
      margin-top: 0.4rem;
      text-align: center;
    }


    .token-title {
      font-weight: 600;
      font-size: 0.75rem;
      margin-bottom: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }


    .token-set {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }


    .counter-controls {
      display: flex;
      justify-content: space-between;
      gap: 0.3rem;
      width: 100%;
      margin-bottom: 0.4rem;
      background: #0f1115 !important;
      padding: 0.3rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }


    .counter-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      flex: 1;
    }


    .counter-group label {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }


    .counter-group select {
      width: 100%;
      padding: 0.1rem;
      font-size: 0.7rem;
      background: var(--card-bg) !important;
      color: #fff !important;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }


    .external-links {
      display: flex;
      gap: 0.3rem;
      justify-content: center;
      width: 100%;
    }


    .external-links a {
      font-size: 0.62rem;
      text-decoration: none;
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
      color: #fff;
      font-weight: 500;
    }


    .link-ck { background-color: #2251a3; }
    .link-scryfall { background-color: #33333e; }


    .status-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 2rem;
      font-size: 0.9rem;
      grid-column: 1 / -1;
    }


    .empty-card {
      border: 2px dashed var(--border-color);
      background: transparent;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      min-height: 200px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body style="background-color: #0f1115 !important;">


  <header>
    <div class="top-bar">
      <h1>MTG Tokens</h1>
      <div class="search-controls">
        <input type="text" id="searchInput" placeholder="Search...">
        <button id="searchBtn">Find</button>
      </div>
    </div>


    <div class="slot-selectors">
      <div class="slot-group">
        <div class="slot-header">
          <label>Slot 1</label>
          <button class="lock-btn" data-slot="0" id="lock-0">🔓</button>
        </div>
        <select id="slot0" class="slot-select" data-slot="0"></select>
      </div>
      <div class="slot-group">
        <div class="slot-header">
          <label>Slot 2</label>
          <button class="lock-btn" data-slot="1" id="lock-1">🔓</button>
        </div>
        <select id="slot1" class="slot-select" data-slot="1"></select>
      </div>
      <div class="slot-group">
        <div class="slot-header">
          <label>Slot 3</label>
          <button class="lock-btn" data-slot="2" id="lock-2">🔓</button>
        </div>
        <select id="slot2" class="slot-select" data-slot="2"></select>
      </div>
      <div class="slot-group">
        <div class="slot-header">
          <label>Slot 4</label>
          <button class="lock-btn" data-slot="3" id="lock-3">🔓</button>
        </div>
        <select id="slot3" class="slot-select" data-slot="3"></select>
      </div>
    </div>
  </header>


  <main>
    <div id="content" class="board-grid"></div>
  </main>


  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
    }


    let currentTokens = [];
    const activeSlots = [
      { token: null, qty: 1, counters: 0, isLocked: false },
      { token: null, qty: 1, counters: 0, isLocked: false },
      { token: null, qty: 1, counters: 0, isLocked: false },
      { token: null, qty: 1, counters: 0, isLocked: false }
    ];


    const contentDiv = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const slotSelects = document.querySelectorAll('.slot-select');
    const lockButtons = document.querySelectorAll('.lock-btn');


    async function fetchTokens(query = '') {
      contentDiv.innerHTML = '<div class="status-msg">Loading complete token database...</div>';
      
      let searchQuery = '(t:token OR layout:token OR t:emblem)';
      if (query.trim() !== '') searchQuery += ` ${query}`;


      let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery)}&unique=art`;
      let allTokens = [];


      try {
        while (url) {
          const response = await fetch(url);
          if (!response.ok) {
            if (allTokens.length === 0) throw new Error('No tokens found.');
            break;
          }
          const data = await response.json();
          allTokens = allTokens.concat(data.data || []);
          url = data.has_more ? data.next_page : null;
        }


        currentTokens = allTokens.sort((a, b) => a.name.localeCompare(b.name));


        let availableIndex = 0;
        for (let i = 0; i < 4; i++) {
          if (!activeSlots[i].isLocked) {
            if (availableIndex < currentTokens.length) {
              activeSlots[i].token = currentTokens[availableIndex];
              availableIndex++;
            } else {
              activeSlots[i].token = null;
            }
          }
        }


        populateSlotDropdowns();
        render();
      } catch (err) {
        contentDiv.innerHTML = `<div class="status-msg">${err.message}</div>`;
      }
    }


    function populateSlotDropdowns() {
      // Generate individual letter groups: A, B, C ... Z + #/Other
      const letters = Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
      const allGroups = [...letters, "#/Other"];


      slotSelects.forEach((select, slotIdx) => {
        select.innerHTML = '<option value="-1">-- Empty --</option>';


        const optGroups = {};
        allGroups.forEach(grp => {
          const og = document.createElement('optgroup');
          og.label = grp;
          optGroups[grp] = og;
        });


        currentTokens.forEach((token, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = `${token.name} (${token.set.toUpperCase()})`;


          const firstChar = token.name.trim().charAt(0).toUpperCase();
          const groupKey = letters.includes(firstChar) ? firstChar : "#/Other";


          optGroups[groupKey].appendChild(opt);
        });


        // Append non-empty letter groups to the select element
        allGroups.forEach(grp => {
          if (optGroups[grp].children.length > 0) {
            select.appendChild(optGroups[grp]);
          }
        });


        if (activeSlots[slotIdx].token) {
          const matchedIdx = currentTokens.findIndex(t => t.id === activeSlots[slotIdx].token.id);
          select.value = matchedIdx !== -1 ? matchedIdx : -1;
        } else {
          select.value = -1;
        }
      });
    }


    function render() {
      contentDiv.innerHTML = activeSlots.map((slot, slotIdx) => {
        if (!slot.token) {
          return `<div class="empty-card">Slot ${slotIdx + 1} Empty</div>`;
        }
        return createCardHTML(slot.token, slotIdx, slot);
      }).join('');


      attachCounterListeners();
    }


    function createCardHTML(token, slotIdx, slotState) {
      let imageUrl = token.image_uris?.normal || token.card_faces?.[0]?.image_uris?.normal || '';
      const cardKingdomUrl = `https://www.cardkingdom.com/mtg-tokens/search?filter%5Bsearch%5D=${encodeURIComponent(token.name)}`;
      const scryfallUrl = token.scryfall_uri || '#';


      let qtyOptions = '';
      for (let i = 1; i <= 100; i++) {
        qtyOptions += `<option value="${i}" ${slotState.qty === i ? 'selected' : ''}>${i}</option>`;
      }


      let counterOptions = '';
      for (let i = 0; i <= 100; i++) {
        counterOptions += `<option value="${i}" ${slotState.counters === i ? 'selected' : ''}>+${i}</option>`;
      }


      return `
        <div class="token-card">
          <div class="image-container">
            <img src="${imageUrl}" alt="${token.name}" loading="lazy">
            <div class="token-qty-badge" id="badge-qty-${slotIdx}">x${slotState.qty}</div>
            <div class="pt-counter-badge" id="badge-counters-${slotIdx}" style="${slotState.counters > 0 ? '' : 'display:none;'}">
              +${slotState.counters}/+${slotState.counters}
            </div>
          </div>


          <div class="token-info">
            <div class="token-title">${token.name}</div>
            <div class="token-set">${token.set_name} (${token.set})</div>


            <div class="counter-controls">
              <div class="counter-group">
                <label>Qty</label>
                <select class="qty-select" data-slot="${slotIdx}">${qtyOptions}</select>
              </div>
              <div class="counter-group">
                <label>+1/+1</label>
                <select class="counters-select" data-slot="${slotIdx}">${counterOptions}</select>
              </div>
            </div>


            <div class="external-links">
              <a href="${scryfallUrl}" target="_blank" rel="noopener" class="link-scryfall">Scryfall</a>
              <a href="${cardKingdomUrl}" target="_blank" rel="noopener" class="link-ck">CK</a>
            </div>
          </div>
        </div>
      `;
    }


    function attachCounterListeners() {
      document.querySelectorAll('.qty-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const slotIdx = parseInt(e.target.dataset.slot, 10);
          const val = parseInt(e.target.value, 10);
          activeSlots[slotIdx].qty = val;
          const badge = document.getElementById(`badge-qty-${slotIdx}`);
          if (badge) badge.textContent = `x${val}`;
        });
      });


      document.querySelectorAll('.counters-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const slotIdx = parseInt(e.target.dataset.slot, 10);
          const val = parseInt(e.target.value, 10);
          activeSlots[slotIdx].counters = val;
          const badge = document.getElementById(`badge-counters-${slotIdx}`);
          if (badge) {
            if (val > 0) {
              badge.textContent = `+${val}/+${val}`;
              badge.style.display = 'block';
            } else {
              badge.style.display = 'none';
            }
          }
        });
      });
    }


    slotSelects.forEach(select => {
      select.addEventListener('change', (e) => {
        const slotIdx = parseInt(e.target.dataset.slot, 10);
        const tokenIdx = parseInt(e.target.value, 10);
        activeSlots[slotIdx].token = tokenIdx === -1 ? null : currentTokens[tokenIdx];
        render();
      });
    });


    lockButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const slotIdx = parseInt(e.target.dataset.slot, 10);
        const isLocked = !activeSlots[slotIdx].isLocked;
        activeSlots[slotIdx].isLocked = isLocked;
        
        e.target.textContent = isLocked ? '🔒' : '🔓';
        e.target.classList.toggle('locked', isLocked);
      });
    });


    searchBtn.addEventListener('click', () => fetchTokens(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchTokens(searchInput.value);
    });


    fetchTokens();
  </script>
</body>
</html>

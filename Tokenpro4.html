<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Token Browser</title>
  
  <!-- PWA Manifest & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTG Tokens">
  <link rel="apple-touch-icon" href="https://cards.scryfall.io/a/img/images/card_back.png">


  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #bb86fc;
      --text-color: #e1e1e6;
      --text-muted: #a0a0b0;
      --border-color: #2e323d;
      --badge-bg: rgba(0, 0, 0, 0.85);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevents awkward text highlight on mobile touch */
    }


    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }


    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }


    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }


    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }


    .search-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      justify-content: flex-end;
    }


    input[type="text"], select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem;
      border-radius: 6px;
      outline: none;
    }


    input[type="text"] {
      width: 140px;
    }


    select {
      cursor: pointer;
    }


    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }


    .slot-selectors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      background: var(--bg-color);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }


    .slot-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }


    .slot-group label {
      font-size: 0.65rem;
      color: var(--accent-color);
      font-weight: bold;
      text-transform: uppercase;
    }


    .slot-group select {
      width: 100%;
      font-size: 0.75rem;
      text-overflow: ellipsis;
    }


    main {
      padding: 1rem;
      flex: 1;
    }


    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      max-width: 1200px;
      margin: 0 auto;
      gap: 1rem;
      justify-content: center;
    }


    .token-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .image-container {
      position: relative;
      width: 100%;
    }


    .token-card img {
      width: 100%;
      border-radius: 6px;
      aspect-ratio: 5/7;
      object-fit: cover;
      background-color: #000;
      display: block;
    }


    .token-qty-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--badge-bg);
      color: #fff;
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 1px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      pointer-events: none;
    }


    .pt-counter-badge {
      position: absolute;
      bottom: 20px;
      right: 8px;
      background: var(--badge-bg);
      color: #00e676;
      border: 2px solid #00e676;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 0.75rem;
      font-weight: bold;
      pointer-events: none;
    }


    .token-info {
      width: 100%;
      margin-top: 0.5rem;
      text-align: center;
    }


    .token-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .token-set {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }


    .counter-controls {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      width: 100%;
      margin-bottom: 0.5rem;
      background: var(--bg-color);
      padding: 0.4rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }


    .counter-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      flex: 1;
    }


    .counter-group label {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }


    .counter-group select {
      width: 100%;
      padding: 0.2rem;
      font-size: 0.75rem;
    }


    .external-links {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      width: 100%;
    }


    .external-links a {
      font-size: 0.68rem;
      text-decoration: none;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: #fff;
      font-weight: 500;
    }


    .link-ck { background-color: #2251a3; }
    .link-scryfall { background-color: #33333e; }


    .status-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 2rem;
      font-size: 1rem;
    }


    .empty-card {
      border: 2px dashed var(--border-color);
      background: transparent;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      min-height: 260px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>


  <header>
    <div class="top-bar">
      <h1>MTG Tokens</h1>
      <div class="search-controls">
        <input type="text" id="searchInput" placeholder="Search...">
        <button id="searchBtn">Find</button>
      </div>
    </div>


    <div class="slot-selectors">
      <div class="slot-group"><label>Slot 1</label><select id="slot0" class="slot-select" data-slot="0"></select></div>
      <div class="slot-group"><label>Slot 2</label><select id="slot1" class="slot-select" data-slot="1"></select></div>
      <div class="slot-group"><label>Slot 3</label><select id="slot2" class="slot-select" data-slot="2"></select></div>
      <div class="slot-group"><label>Slot 4</label><select id="slot3" class="slot-select" data-slot="3"></select></div>
    </div>
  </header>


  <main>
    <div id="content" class="board-grid"></div>
  </main>


  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
    }


    let currentTokens = [];
    const activeSlots = [
      { tokenIndex: null, qty: 1, counters: 0 },
      { tokenIndex: null, qty: 1, counters: 0 },
      { tokenIndex: null, qty: 1, counters: 0 },
      { tokenIndex: null, qty: 1, counters: 0 }
    ];


    const contentDiv = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const slotSelects = document.querySelectorAll('.slot-select');


    async function fetchTokens(query = '') {
      contentDiv.innerHTML = '<div class="status-msg">Fetching tokens...</div>';
      
      let searchQuery = 't:token';
      if (query.trim() !== '') searchQuery += ` ${query}`;


      const url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery)}&unique=art`;


      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('No tokens found.');
        const data = await response.json();
        
        currentTokens = data.data || [];
        for (let i = 0; i < 4; i++) {
          activeSlots[i].tokenIndex = i < currentTokens.length ? i : null;
        }


        populateSlotDropdowns();
        render();
      } catch (err) {
        contentDiv.innerHTML = `<div class="status-msg">${err.message}</div>`;
      }
    }


    function populateSlotDropdowns() {
      slotSelects.forEach((select, slotIdx) => {
        select.innerHTML = '<option value="-1">-- Empty --</option>';
        currentTokens.forEach((token, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = `${token.name} (${token.set.toUpperCase()})`;
          select.appendChild(opt);
        });
        select.value = activeSlots[slotIdx].tokenIndex !== null ? activeSlots[slotIdx].tokenIndex : -1;
      });
    }


    function render() {
      contentDiv.innerHTML = activeSlots.map((slot, slotIdx) => {
        if (slot.tokenIndex === null || slot.tokenIndex === -1 || !currentTokens[slot.tokenIndex]) {
          return `<div class="empty-card">Slot ${slotIdx + 1} Empty</div>`;
        }
        return createCardHTML(currentTokens[slot.tokenIndex], slotIdx, slot);
      }).join('');


      attachCounterListeners();
    }


    function createCardHTML(token, slotIdx, slotState) {
      let imageUrl = token.image_uris?.normal || token.card_faces?.[0]?.image_uris?.normal || '';
      const cardKingdomUrl = `https://www.cardkingdom.com/mtg-tokens/search?filter%5Bsearch%5D=${encodeURIComponent(token.name)}`;
      const scryfallUrl = token.scryfall_uri || '#';


      let qtyOptions = '';
      for (let i = 1; i <= 100; i++) {
        qtyOptions += `<option value="${i}" ${slotState.qty === i ? 'selected' : ''}>${i}</option>`;
      }


      let counterOptions = '';
      for (let i = 0; i <= 100; i++) {
        counterOptions += `<option value="${i}" ${slotState.counters === i ? 'selected' : ''}>+${i}</option>`;
      }


      return `
        <div class="token-card">
          <div class="image-container">
            <img src="${imageUrl}" alt="${token.name}" loading="lazy">
            <div class="token-qty-badge" id="badge-qty-${slotIdx}">x${slotState.qty}</div>
            <div class="pt-counter-badge" id="badge-counters-${slotIdx}" style="${slotState.counters > 0 ? '' : 'display:none;'}">
              +${slotState.counters}/+${slotState.counters}
            </div>
          </div>


          <div class="token-info">
            <div class="token-title">${token.name}</div>
            <div class="token-set">${token.set_name} (${token.set})</div>


            <div class="counter-controls">
              <div class="counter-group">
                <label>Qty</label>
                <select class="qty-select" data-slot="${slotIdx}">${qtyOptions}</select>
              </div>
              <div class="counter-group">
                <label>+1/+1</label>
                <select class="counters-select" data-slot="${slotIdx}">${counterOptions}</select>
              </div>
            </div>


            <div class="external-links">
              <a href="${scryfallUrl}" target="_blank" rel="noopener" class="link-scryfall">Scryfall</a>
              <a href="${cardKingdomUrl}" target="_blank" rel="noopener" class="link-ck">CK</a>
            </div>
          </div>
        </div>
      `;
    }


    function attachCounterListeners() {
      document.querySelectorAll('.qty-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const slotIdx = parseInt(e.target.dataset.slot, 10);
          const val = parseInt(e.target.value, 10);
          activeSlots[slotIdx].qty = val;
          const badge = document.getElementById(`badge-qty-${slotIdx}`);
          if (badge) badge.textContent = `x${val}`;
        });
      });


      document.querySelectorAll('.counters-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const slotIdx = parseInt(e.target.dataset.slot, 10);
          const val = parseInt(e.target.value, 10);
          activeSlots[slotIdx].counters = val;
          const badge = document.getElementById(`badge-counters-${slotIdx}`);
          if (badge) {
            if (val > 0) {
              badge.textContent = `+${val}/+${val}`;
              badge.style.display = 'block';
            } else {
              badge.style.display = 'none';
            }
          }
        });
      });
    }


    slotSelects.forEach(select => {
      select.addEventListener('change', (e) => {
        const slotIdx = parseInt(e.target.dataset.slot, 10);
        const tokenIdx = parseInt(e.target.value, 10);
        activeSlots[slotIdx].tokenIndex = tokenIdx === -1 ? null : tokenIdx;
        render();
      });
    });


    searchBtn.addEventListener('click', () => fetchTokens(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchTokens(searchInput.value);
    });


    fetchTokens();
  </script>
</body>
</html>
